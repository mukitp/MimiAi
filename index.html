<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimi - Bangladeshi AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: #f9fafb; font-family: sans-serif; }
        #chat-box { flex: 1; overflow-y: auto; padding: 1rem; scroll-behavior: smooth; }
        pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin: 0.5rem 0; font-size: 0.85rem; }
        code { font-family: monospace; background: rgba(0,0,0,0.05); padding: 0.1rem 0.3rem; border-radius: 0.25rem; }
        pre code { background: none; padding: 0; }
        .typing-dots span { width: 6px; height: 6px; margin: 0 1px; background-color: #3b82f6; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body class="antialiased">

    <div class="p-4 bg-white border-b border-gray-100 flex items-center gap-3 sticky top-0 z-50">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">M</div>
        <div>
            <h1 class="text-base font-bold text-gray-900 leading-tight">MimiAI</h1>
            <p class="text-[9px] text-gray-400 uppercase font-black tracking-widest">Bangladeshi AI Model</p>
        </div>
    </div>

    <div id="chat-box" class="space-y-4">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs flex-shrink-0">M</div>
            <div class="bg-white p-3.5 px-4 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm text-sm text-gray-700 max-w-[85%] leading-relaxed">
                আসসালামু আলাইকুম! আমি MimiAI। আপনাকে কীভাবে সাহায্য করতে পারি?
            </div>
        </div>
    </div>

    <div class="p-3 bg-white border-t border-gray-100">
        <div class="max-w-4xl mx-auto flex items-center gap-2 bg-gray-50 p-1.5 rounded-2xl border border-gray-200 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500/10 transition-all">
            <input id="user-input" type="text" placeholder="এখানে লিখুন..." class="flex-1 bg-transparent p-2.5 px-4 focus:outline-none text-gray-800 text-[16px]" autocomplete="off">
            <button onclick="sendMessage()" class="bg-blue-600 p-3 rounded-xl text-white shadow-lg active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            const userDiv = document.createElement('div');
            userDiv.className = "flex flex-col items-end";
            userDiv.innerHTML = `<div class="bg-blue-600 text-white p-3 px-4 rounded-2xl rounded-br-none shadow-md max-w-[85%] text-sm">${message}</div>`;
            chatBox.appendChild(userDiv);
            userInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const typingDiv = document.createElement('div');
            typingDiv.className = "flex items-start gap-3";
            typingDiv.innerHTML = `<div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs flex-shrink-0">M</div><div class="bg-white p-3 px-6 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm flex items-center h-10"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                chatBox.removeChild(typingDiv);
                
                const aiDiv = document.createElement('div');
                aiDiv.className = "flex items-start gap-3";
                aiDiv.innerHTML = `<div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs flex-shrink-0">M</div><div class="bg-white p-3.5 px-4 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm text-sm text-gray-700 max-w-[85%] leading-relaxed">${marked.parse(data.reply)}</div>`;
                chatBox.appendChild(aiDiv);
            } catch (error) {
                if(chatBox.contains(typingDiv)) chatBox.removeChild(typingDiv);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
