<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimi - Bangladeshi AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .typing-dots span { width: 8px; height: 8px; margin: 0 2px; background-color: #3b82f6; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col overflow-hidden">

    <header class="p-4 bg-white shadow-sm flex items-center border-b border-gray-100">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg text-lg">M</div>
            <div>
                <h1 class="text-xl font-bold text-gray-800 leading-none">Mimi<span class="text-blue-600">AI</span></h1>
                <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest font-semibold">Bangladeshi AI Model</p>
            </div>
        </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50/50">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm flex-shrink-0">M</div>
            <div class="bg-white p-3 px-4 rounded-2xl rounded-tl-none border border-gray-200 shadow-sm w-fit max-w-[85%]">
                আসসালামু আলাইকুম! আমি MimiAI। আপনাকে কীভাবে সাহায্য করতে পারি?
            </div>
        </div>
    </div>

    <div class="p-4 bg-white border-t border-gray-100">
        <div class="max-w-4xl mx-auto flex items-center gap-2 bg-gray-100 p-1.5 rounded-full border border-gray-200 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-100 transition">
            <input id="user-input" type="text" placeholder="এখানে লিখুন..." class="flex-1 bg-transparent p-2 px-4 focus:outline-none text-gray-800 text-lg">
            <button onclick="sendMessage()" class="bg-blue-600 p-3 rounded-full text-white hover:bg-blue-700 shadow-md transition transform active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // ১. ইউজারের মেসেজ দেখানো
            const userDiv = document.createElement('div');
            userDiv.className = "flex flex-col items-end gap-1";
            userDiv.innerHTML = `<div class="bg-blue-600 text-white p-3 px-4 rounded-2xl rounded-br-none shadow-sm w-fit max-w-[85%]">${message}</div>`;
            chatBox.appendChild(userDiv);
            userInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // ২. টাইপিং ইন্ডিকেটর দেখানো
            const typingDiv = document.createElement('div');
            typingDiv.className = "flex items-start gap-3";
            typingDiv.innerHTML = `<div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm flex-shrink-0">M</div><div class="bg-white p-3 px-6 rounded-2xl rounded-tl-none border border-gray-200 shadow-sm w-fit flex items-center h-10"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // ৩. সার্ভারলেস ফাংশনে রিকোয়েস্ট পাঠানো
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                chatBox.removeChild(typingDiv);
                
                // ৪. এআই এর রিপ্লাই দেখানো
                const aiDiv = document.createElement('div');
                aiDiv.className = "flex items-start gap-3";
                aiDiv.innerHTML = `<div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm flex-shrink-0">M</div><div class="bg-white p-3 px-4 rounded-2xl rounded-tl-none border border-gray-200 shadow-sm w-fit max-w-[85%] whitespace-pre-wrap">${data.reply}</div>`;
                chatBox.appendChild(aiDiv);
            } catch (error) {
                chatBox.removeChild(typingDiv);
                alert("কানেকশনে সমস্যা হয়েছে!");
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
