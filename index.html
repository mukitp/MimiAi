<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimi - Bangladeshi AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth Scrolling */
        html, body { height: 100%; overflow: hidden; }
        .typing-dots span { width: 6px; height: 6px; margin: 0 1px; background-color: #3b82f6; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        #chat-box::-webkit-scrollbar { width: 3px; }
        #chat-box::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="bg-white text-gray-900 flex flex-col h-screen">

    <header class="p-3 bg-white shadow-sm flex items-center border-b border-gray-100 sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold shadow-md text-base">M</div>
            <div>
                <h1 class="text-lg font-bold text-gray-800 leading-none">Mimi<span class="text-blue-600">AI</span></h1>
                <p class="text-[9px] text-gray-500 mt-0.5 uppercase tracking-widest font-bold">Bangladeshi AI Model</p>
            </div>
        </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[#f8fafc]">
        <div class="flex items-start gap-2.5">
            <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs flex-shrink-0">M</div>
            <div class="bg-white p-3 px-4 rounded-2xl rounded-tl-none border border-gray-200 shadow-sm w-fit max-w-[88%] text-[15px]">
                আসসালামু আলাইকুম! আমি MimiAI। আপনাকে কীভাবে সাহায্য করতে পারি?
            </div>
        </div>
    </div>

    <div class="p-3 bg-white border-t border-gray-100 pb-safe">
        <div class="max-w-4xl mx-auto flex items-center gap-2 bg-gray-100 p-1 rounded-full border border-gray-100 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-100 transition duration-300">
            <input id="user-input" type="text" placeholder="এখানে লিখুন..." class="flex-1 bg-transparent p-2.5 px-4 focus:outline-none text-gray-800 text-[16px]">
            <button onclick="sendMessage()" class="bg-blue-600 p-2.5 rounded-full text-white hover:bg-blue-700 shadow-md transition transform active:scale-90 flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // User Message
            const userDiv = document.createElement('div');
            userDiv.className = "flex flex-col items-end gap-1";
            userDiv.innerHTML = `<div class="bg-blue-600 text-white p-3 px-4 rounded-2xl rounded-br-none shadow-sm w-fit max-w-[88%] text-[15px]">${message}</div>`;
            chatBox.appendChild(userDiv);
            userInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Typing Indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = "flex items-start gap-2.5";
            typingDiv.innerHTML = `<div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs flex-shrink-0">M</div><div class="bg-white p-3 px-5 rounded-2xl rounded-tl-none border border-gray-200 shadow-sm w-fit flex items-center h-9"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                chatBox.removeChild(typingDiv);
                
                const aiDiv = document.createElement('div');
                aiDiv.className = "flex items-start gap-2.5";
                aiDiv.innerHTML = `<div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs flex-shrink-0">M</div><div class="bg-white p-3 px-4 rounded-2xl rounded-tl-none border border-gray-200 shadow-sm w-fit max-w-[88%] text-[15px] whitespace-pre-wrap">${data.reply}</div>`;
                chatBox.appendChild(aiDiv);
            } catch (error) {
                if(chatBox.contains(typingDiv)) chatBox.removeChild(typingDiv);
                alert("দুঃখিত, কানেকশনে সমস্যা হয়েছে!");
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
